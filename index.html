<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="description" content="Aktuelle Verkehrslage und Staus für Feuerwehr Oberndorf – basierend auf Waze-Daten"/>
<title>Verkehrsansicht</title>

<!-- PWA Manifest & Theme -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e74c3c">
<link rel="apple-touch-icon" href="web-app-manifest-192x192.png">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous"/>

<!-- MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

<!-- Eigenes CSS -->
<link rel="stylesheet" href="css/styles.css"/>
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
</head>
<body>
<div id="list-container">
  <div class="header-section">
    <h1>Verkehrsansicht</h1>
    <div class="header-actions">
      <button id="test-alarm" class="test-alarm-btn"> 🔔 Testalarm </button>
      <button id="manual-refresh" class="refresh-btn"> ↻ Aktualisieren </button>
      <button id="theme-toggle" class="theme-btn"> 🌙 Dark Mode </button>
      <button id="toggle-view" class="toggle-view-btn">📱 Karte vergrößern</button>
    </div>
  </div>
  <div id="last-updated" aria-live="polite">Lade Daten...</div>
  <div id="countdown-timer" aria-live="polite"></div>
  <div id="status" class="loading" role="alert">Daten werden vom Proxy geladen...</div>
  <div id="categories-container"></div>
</div>
<div id="map-container"></div>

<!-- Skripte --> 
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script> 
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> 
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script> 
<script src="js/map.js"></script> 
<script type="module" src="js/data.js"></script> 
<script type="module" src="js/utils.js"></script> 
<script type="module" src="js/ui.js"></script> 
<script type="module" src="js/theme.js"></script> 
<script type="module" src="js/main.js"></script> 
<!-- Service Worker Registration --> 
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('✅ Service Worker registriert', reg.scope))
        .catch(err => console.log('❌ Service Worker Registrierung fehlgeschlagen', err));
    });
  }
</script>
</body>
</html>
